name: Release checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_DEPLOY_SKIP: '1'
      DATABASE_URL: ''
      DATABASE_URL_UNPOOLED: ''
      LIBRARY_CONTENT_SOURCE: database
      PORTRAIT_PAID_ENABLED: '0'
      PORTRAIT_VOICE_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install media inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npx next typegen
      - run: npm run release:check
      - run: npx playwright install --with-deps chrome
      - run: npm run test:admin
      - name: Record browser graphics profile
        run: |
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ channel: 'chrome', args: ['--enable-unsafe-swiftshader'] });
          try {
            const page = await browser.newPage();
            console.log(JSON.stringify(await page.evaluate(() => {
              const gl = document.createElement('canvas').getContext('webgl2');
              const debug = gl?.getExtension('WEBGL_debug_renderer_info');
              return { webgl2: !!gl, renderer: debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : null };
            })));
          } finally { await browser.close(); }
          JS
      # Native scene gestures and frame timing require the recorded workstation GPU
      # qualification (npm run test:browser); the hosted runner renders in software.
      - name: Portable browser checks
        run: >-
          npm run test:browser -- tests/browser/library.spec.ts
          --grep 'HTML catalog and reader|sample edits move|server detail and catalog|WebGL unavailable on first entry|host and arbitrary preview flags'
          --reporter=line --max-failures=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: |
            .local-library/evidence
            test-results
